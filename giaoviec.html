<!DOCTYPE html>
<html lang="vi">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Giao Việc</title>
</head>
<body>

    <!-- BẢNG 1: BẢNG GIAO VIỆC (Mặc định khóa) -->
        <div class="card disabled-section" id="sectionGiaoViec">
            <div class="card-header bg-primary">1. Bảng Giao Việc Mới</div>
            <div class="card-body">
                <div class="auth-lock-msg">
                    🔒 Vui lòng <a href="#" onclick="openAuthModal('login')">Đăng nhập</a> để sử dụng chức năng Giao việc.
                </div>
                <div class="card-body-content">
                    <form id="formGiaoViec" onsubmit="event.preventDefault(); taoCongViec();">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Mã Danh Bộ (11 số)</label>
                                <input type="text" id="inputMaDanhBo" class="form-control" maxlength="11" required placeholder="Nhập đúng 11 chữ số">
                            </div>
                            <div class="form-group">
                                <label>Số Thân</label>
                                <input type="text" id="inputSoThan" class="form-control" required placeholder="Nhập số thân ĐH">
                            </div>
                            <div class="form-group">
                                <label>Hình Ảnh Đồng Hồ (Link URL)</label>
                                <input type="text" id="jobImageUrl" class="form-control" placeholder="Dán link ảnh từ internet vào đây (ví dụ: https://.../anh.jpg)">
                            </div>
                            <div class="form-group">
                                <label>Việc Giao</label>
                                <input type="text" id="inputViecGiao" class="form-control" required placeholder="Nội dung công việc">
                            </div>
                            <div class="form-group">
                                <label>Bộ Phận Nhận</label>
                                <select id="inputBoPhan" class="form-select">
                                    <option value="Đội QLGT">Đội QLGT</option>
                                    <option value="Đội QLML kv1">Đội QLML kv1</option>
                                    <option value="Đội QLML kv2">Đội QLML kv2</option>
                                    <option value="Ban KinhDoanh">Ban KinhDoanh</option>
                                    <option value="Ban Kế hoạch vật tư">Ban Kế hoạch vật tư</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">➕ Giao Việc</button>

                        


                        <!-- Khung giao việc bằng file và ảnh hàng loạt -->
                            <div class="form-group" style="display: inline-block; vertical-align: top; margin-left: 15px; border: 1px dashed #bbb; padding: 10px; border-radius: 5px; background: #f9f9f9;">
                                <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #333;">📦 Giao Việc Hàng Loạt (Chỉ nhập text CSV):</label>
                                
                                <!-- 1. Ô chọn file dữ liệu CSV -->
                                <div style="margin-bottom: 5px;">
                                    <span style="font-size: 11px; color: #555; display: block;">Dữ liệu (.csv):</span>
                                    <input type="file" id="inputGiaoViecFile" accept=".csv, .txt" class="form-control" style="font-size: 12px; display: inline-block; width: 200px;">
                                </div>
                                
                                <!-- 2. Nút bấm xử lý -->
                                <button type="button" onclick="giaoViecKemAnhHangLoat()" class="btn btn-info btn-xs" style="padding: 6px 12px; font-weight: bold; width: 100%;">
                                    📤 Nạp File CSV
                                </button>
                            </div>





                    </form>
                </div>
            </div>
        </div>

    </body>
</html>
